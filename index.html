<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04050a">
<title>Coronation Intelligence</title>
<meta name="description" content="Concept preview of an AI operating layer for Coronation. Illustrative data only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff2e4d' stroke-width='2' stroke-linejoin='round'%3E%3Cpath d='M3 8l4 4 5-7 5 7 4-4-2 11H5z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bg"></canvas>
<div id="cursor-glow"></div>
<div class="fx-vignette"></div>
<div class="fx-scan"></div>
<div class="fx-noise"></div>
<div class="route-beam" id="beam"></div>

<section id="boot">
  <canvas id="boot-canvas"></canvas>
  <div class="boot-corner tl">SYS://CORONATION.AI<br>NODE SYD-01</div>
  <div class="boot-corner tr"><span id="boot-clock">--:--:--</span><br>AUSTRALIA/SYDNEY</div>
  <div class="boot-corner bl">CONCEPT BUILD 0.9<br>ILLUSTRATIVE DATA</div>
  <div class="boot-corner br">ENCRYPTED · AES-256<br>PRIVATE TENANT</div>
  <div class="boot-inner">
    <svg class="boot-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/><path d="M6.5 16h11" /></svg>
    <div class="boot-title" id="boot-title">CORONATION</div>
    <div class="boot-sub">INTELLIGENCE</div>
    <div class="boot-log" id="boot-log"></div>
    <div class="boot-bar"><i id="boot-bar"></i></div>
    <div class="boot-meta"><span id="boot-stage">INITIALISING</span><span id="boot-pct">0%</span></div>
    <button class="boot-enter" id="boot-enter">ENTER</button>
  </div>
</section>

<div id="app">
  <aside class="rail">
    <div class="brand" onclick="location.hash='#/core'">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg>
      <div><div class="brand-t">CORONATION</div><div class="brand-s">INTELLIGENCE</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="row"><span class="agents-online"><span class="mini-bars"><i></i><i></i><i></i><i></i></span><span id="agents-on">9 AGENTS ONLINE</span></span></div>
      <div class="row"><span>INDEXED</span><span id="idx-count">48,213</span></div>
      <div class="row"><span>LATENCY</span><span id="lat">24ms</span></div>
    </div>
  </aside>

  <header class="topbar">
    <div class="crumb" id="crumb">CORONATION / <b>CORE</b></div>
    <form class="ask-bar" id="ask-bar" autocomplete="off">
      <span class="ic-wrap"></span>
      <input id="ask-input" placeholder="Ask anything about your projects, people or inbox…">
      <span class="kbd">/</span>
    </form>
    <div class="top-right">
      <span class="chip demo" title="All names, figures and documents are placeholders"><span class="dot amber"></span><span>CONCEPT · PLACEHOLDER DATA</span></span>
      <span class="clock">SYD <b id="clock">--:--</b></span>
      <button class="icon-btn" id="sfx-btn" title="Interface sound"></button>
    </div>
  </header>

  <main id="view"></main>
</div>

<div id="drawer"><div class="scrim"></div><div class="panel"></div></div>
<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/fx.js"></script>
<script src="js/building.js"></script>
<script src="js/views-core.js"></script>
<script src="js/views-briefing.js"></script>
<script src="js/views-ask.js"></script>
<script src="js/views-watchdog.js"></script>
<script src="js/views-actions.js"></script>
<script src="js/views-projects.js"></script>
<script src="js/views-people.js"></script>
<script src="js/views-comms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
